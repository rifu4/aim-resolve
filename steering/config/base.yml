---

base_opt.0:
  n_total_iterations: 10
  n_major_iterations: 10
  n_minor_iterations: 2
  n_samples: 2
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + [100]
      maxiter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + [1000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 0
      maxiter: 10
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 2*[5] + 2*[10] + [20]
      miniter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + [10]
      maxiter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + [50]
      energy_reduction_factor: 0.001
  sample_mode: 4*[linear_resample] + [nonlinear_resample]

base_opt.n:
  n_total_iterations: 10
  n_major_iterations: 10
  n_minor_iterations: 2
  n_samples: 2
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 500
      maxiter: 2000
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 5
      maxiter: 20
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 20
      miniter: 50
      maxiter: 200
      energy_reduction_factor: 0.001
  sample_mode: nonlinear_resample

base_trans:
  n_total_iterations: 20
  n_samples: 1
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 4*[100] + 4*[200] + 4*[350] + 4*[500] + [100]
      maxiter: 4*[100] + 4*[200] + 4*[350] + 4*[500] + [1000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 0
      maxiter: 10
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 4*[5] + 4*[10] + [20]
      miniter: 4*[5] + 4*[10] + 4*[20] + 4*[35] + [10]
      maxiter: 4*[5] + 4*[10] + 4*[20] + 4*[35] + [50]
      energy_reduction_factor: 0.001
  sample_mode: 8*[linear_resample] + [nonlinear_resample]

---

base_seg:
  seg_model:
    name: unet128
    odir: train/files
  transform:
    log: true
    normalize: true
    standardize: false
    rotate: false
    flip: false
  n_orders: 5
  coordinates: false

base_clu:
  alg: dbscan
  eps: 0.2
  min_samples: 2

---

base_model:
  zoom: 1
  masks:
    margin_fac: 0.2
    margin_min: 5
    max_objects: 5
  points: true
  objects:
    gaussian:
      mean_fac: 0.1
      std_fac: 0.01
  tiles:
    tile_size: 32
    gaussian:
      mean_fac: 0.1
      std_fac: 0.01

---

base_plot:
  cmap: 'inferno'
  norm: 'log'
  vmin: ~
  vmax: ~ 
  cbar: true
  ticks: 5
  plot_grid: true
  plot_label: true

---

params_fs:
  zero_mode: [3, 1]
  spatial_amplitude:
    fluctuations: [5, 1]
    loglogavgslope: [-2, 0.5]
    flexibility: [1.2, 0.4]
    asperity: [0.2, 0.2]
  spectral_index:
    mean: [-1, 0.5]
    fluctuations: [3, 1]
  spectral_amplitude: null
  deviations: null

