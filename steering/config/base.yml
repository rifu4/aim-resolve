---

base_opt.0:
  n_total_iterations: 10
  n_major_iterations: 10
  n_minor_iterations: 2
  n_samples: 2
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000]
      maxiter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 0
      maxiter: 10
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 2*[5] + 2*[10] + [20]
      miniter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50]
      maxiter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50]
      energy_reduction_factor: 0.001
  sample_mode: 4*[linear_resample] + [nonlinear_resample]

base_opt.n:
  n_total_iterations: 10
  n_major_iterations: 10
  n_minor_iterations: 2
  n_samples: 2
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 1000
      maxiter: 2000
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 10
      maxiter: 20
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 20
      miniter: 100
      maxiter: 200
      energy_reduction_factor: 0.001
  sample_mode: 6*[nonlinear_resample] + [nonlinear_update]   # keep the samples in the last iterations

base_trans:
  n_total_iterations: 10
  n_samples: 1
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000]
      maxiter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 0
      maxiter: 10
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 2*[5] + 2*[10] + [20]
      miniter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50]
      maxiter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50]
      energy_reduction_factor: 0.001
  sample_mode: 4*[linear_resample] + [nonlinear_resample]

---

base_seg:
  seg_model:
    name: unet1024_dice30
    odir: train/files
  transform:
    log: true
    normalize: true
    standardize: false
    rotate: false
    flip: false
  n_orders: 5
  coordinates: false

base_clu:
  alg: dbscan
  eps: 0.2
  min_samples: 2

# detection method: unet (U-Net + DBSCAN, uses base_seg/base_clu), agent (Claude API, uses base_agent)
# or manual (same task as agent, answered by hand as {it}_submission.json, no API)
base_prefit:
  reset_noise: true   # every reconstruction starts its noise model at the prior (taken over, it grew each iteration)

base_detect:
  method: unet
  edge_dist: 5      # drop detections within this many pixels of the field edge (0: keep all)

base_agent:
  model: claude-opus-5-5
  effort: high
  max_turns: 25
  n_orders: 5
  view_px: 768
  min_contrast: 20.0
  merge_dist: 5.0
  pair_dist: 40.0
  pair_ratio: 15.0
  obj_threshold: 1.0e-3
  obj_min_frac: 0.1
  compact_threshold: 0.05
  compact_box: 8
  snap_radius: 3

---

base_model:
  # zoom factor of the components relative to grid_bg: one factor for all iterations, or a list with one factor per
  # iteration (the last entry holds for later iterations), e.g. [1, 1, 1, 3, 3]: the model step of iteration 3 refines
  # the grids, and the detection of iteration 4 runs on the zoomed reconstruction (pixel settings scaled by detect.py)
  zoom: 1
  zoom_bg: false     # true: the background on the zoomed grid as well (otherwise only the components are refined)
  # stable boxes (PLAN_reuse.md, part B): a new component that is the same source as an old one keeps the old box,
  # offset, prior and taper (section reuse.{it} of the model file, decisions in reuse/); the pre-fit copies them (part C).
  reuse:
    enabled: false
    iou_min: 0.7       # intersection over union of the new and old mask supports
    area_min: 0.7      # minimum ratio of the box areas (new / old), otherwise the box should shrink
    fit_margin: 0.5    # the core of the new mask keeps this fraction of margin_min inside the old box
  masks:
    margin_fac: 0.1    # was 0.2: the agent masks follow the objects closely, 10% keeps the boxes compact
    margin_min: 10     # was 5: minimum margin for the many small compact sources (tiles)
    max_objects: 8     # was 5: lobe groups wider than a tile become objects, extra ones would be dropped
  points: true
  objects:
    params_sf: params_sf_comp
    params_mf: params_mf_comp
    gaussian:
      mean_fac: 0.2
      std_fac: 0     # fixed taper (no prior)
  tiles:
    tile_size: 32
    params_sf: params_sf_comp
    params_mf: params_mf_comp
    gaussian:
      mean_fac: 0.2
      std_fac: 0     # fixed taper (no prior)

---

base_plot:
  cmap: 'inferno'
  norm: 'log'
  vmin: ~
  vmax: ~ 
  cbar: true
  ticks: 5
  plot_grid: true
  plot_label: true

# style of the pipeline plots (plots/ and callback/; extra/ and trans/ use base_plot)
base_style:
  theme: dark           # dark (white axes and text) or light (black axes and text)
  transparent: true     # transparent figure background
  halo: true            # thin outline in the opposite color, readable on light and dark backgrounds
  halo_width: 1.0       # halo width in points
  dynamic_range: 1.0e+5 # vmin = vmax / dynamic_range (vmax: full-sky maximum or base_plot.vmax)
  step_label: true      # pipeline step and iteration in a header line above the panels
  rows: ~               # panel rows / columns (as plot_arrays); default as square as possible
  cols: ~
  fig_width: 8.0        # figure width in inches (equal for all plots, panels share it)
  dpi: 300

---

# single-frequency version of the spectral (ubik) model: same spatial parameters as params_mf, so a
# later frequency transition copies the sky exactly (spectral entries are not needed for one frequency)
# spatial priors from the posterior of fast_vi_1f_1024_1z_agent2 (it 1): flexibility 0.05-0.46, fluctuations 0.5-1.4,
# slope -1.2 to -1.55, zero mode 0.003-0.67 (was [1, 1], [3, 1], [-2, 0.5], [1.2, 0.4]: excitations of up to 10 sigma)
params_sf:
  zero_mode: [0.3, 0.3]
  spatial_amplitude:
    fluctuations: [1, 0.5]
    loglogavgslope: [-1.4, 0.4]
    flexibility: [0.2, 0.2]
    asperity: [0.05, 0.05]   # was [0.2, 0.2]: background and central galaxy of agent3 at 0.005-0.008 (-3.5 to -4 sigma)

params_mf:   # spatial part identical to params_sf (the frequency transition copies the sky)
  zero_mode: [0.3, 0.3]
  spatial_amplitude:
    fluctuations: [1, 0.5]
    loglogavgslope: [-1.4, 0.4]
    flexibility: [0.2, 0.2]
    asperity: [0.05, 0.05]
  spectral_index:
    mean: [-1, 0.5]
    fluctuations: [1, 0.5]
  spectral_amplitude:
    loglogavgslope: [-1.4, 0.4]
    flexibility: [0.2, 0.2]
    asperity: [0.2, 0.2]
  deviations:
    process: wiener
    sigma: [0.2, 0.08]

# priors of the objects and tiles (base_model.objects/tiles.params_sf, params_mf): currently the same values as params_sf /
# params_mf. A narrower zero mode matches the final posteriors (agent3: objects 0.008, tiles 4e-6), but the pre-fit needs the
# freedom to correct the start offsets (agent4 with 0.02 and 0.1: o1 stayed at its start level)
params_sf_comp:
  zero_mode: [0.3, 0.3]   # as the background: 0.02 and 0.1 were too tight, the pre-fit could not lift the start offsets (o1 of agent4)
  spatial_amplitude:
    fluctuations: [1, 0.5]
    loglogavgslope: [-1.4, 0.4]
    flexibility: [0.2, 0.2]
    asperity: [0.05, 0.05]

params_mf_comp:   # params_mf with the zero mode of params_sf_comp
  zero_mode: [0.3, 0.3]
  spatial_amplitude:
    fluctuations: [1, 0.5]
    loglogavgslope: [-1.4, 0.4]
    flexibility: [0.2, 0.2]
    asperity: [0.05, 0.05]
  spectral_index:
    mean: [-1, 0.5]
    fluctuations: [1, 0.5]
  spectral_amplitude:
    loglogavgslope: [-1.4, 0.4]
    flexibility: [0.2, 0.2]
    asperity: [0.2, 0.2]
  deviations:
    process: wiener
    sigma: [0.2, 0.08]

params_ps:
  i0:
    mean: 0
    std: 1
  alpha:
    mean: -1
    std: 0.5
  deviations:
    process: wiener
    sigma: [0.2, 0.08]
