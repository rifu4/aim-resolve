---

# fast_sf.yml on a 1536 px grid (4.7 arcsec instead of 7.0 arcsec for 2 deg): the grid reaches 22,000 lambda,
# only 0.36 % of the visibilities lie beyond it (1024 px: 2.8 %, effective resolution 9.4 instead of 14 arcsec).
# All settings in pixels are scaled by 1.5 so that they cover the same angular sizes as in fast_sf.yml.

# specify the main pipeline settings (output directory, key, number of iterations, and the trained U-Net)
odir: runs/fast_vi_1f_1536_1z_agent4
key: 42

n_it: 4

# additional plots (saved if true)
callback: true
trans: true
rerun: true

--- 

# specify the data to be reconstructed and the background grid (space and field of view)
data:
  fname: /scratch/users/rfuchs/data/eso_1007-1053mhz_wfix.npz
  fun: radio

likelihood:
  mode: fast
  pb_correction: true   # MeerKAT primary beam in the forward model (fast mode only): the sky model is the intrinsic sky
  noise:
    parameters:
      mode: 1.0
      mean: 1.05   # was 1.1: inflations of 10x (short baselines in agent3) are no longer reachable, 3x still are
    scaling: true

grid_bg:
  space: [1536, 1536]   # 4.7 arcsec pixels
  fov: [2deg, 2deg]

---

# overwrite the default inference settings
base_opt.0:
  n_major_iterations: 10
  n_minor_iterations: 2
  n_samples: 2
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000]
      maxiter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 0
      maxiter: 10
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 2*[5] + 2*[10] + [20]
      miniter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50]
      maxiter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50]
      energy_reduction_factor: 0.001
  sample_mode: 4*[linear_resample] + [nonlinear_resample]

base_opt.n:
  n_major_iterations: 10
  n_minor_iterations: 2
  n_samples: 2
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 1000
      maxiter: 2000
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 10
      maxiter: 20
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 20
      miniter: 100
      maxiter: 200
      energy_reduction_factor: 0.001
  sample_mode: 4*[nonlinear_resample] + [nonlinear_update]   # new samples while the posterior still moves, then keep and update them

base_trans:
  n_total_iterations: 15   # was 10: the component fits were not converged
  n_samples: 1
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.0e-11
      miniter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 7*[1000]
      maxiter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 7*[1000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 0.0001
      cg_kwargs:
        name: null
      miniter: 0
      maxiter: 10
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.0e-10
      cg_kwargs:
        name: null
        miniter: 2*[5] + 2*[10] + [20]
      miniter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 7*[50]
      maxiter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 7*[50]
      energy_reduction_factor: 0.001
  sample_mode: 4*[linear_resample] + [nonlinear_resample]

---

# overwrite the default segmentation parameters
base_seg:
  seg_model:
    name: unet1024
    odir: train/runs/files
  transform:
    log: true
    normalize: true
    standardize: false
    rotate: false
    flip: false
  n_orders: 5
  coordinates: false

# overwrite the default clustering parameters
base_clu:
  alg: dbscan
  eps: 0.2
  min_samples: 2

# source detection: unet (uses base_seg/base_clu), agent (Claude API) or manual (agent task
# answered by hand or by steering/run_with_claude.sh, no API): the detect rule writes
# {odir}/agent/{it}_task/task.md and stops; write {odir}/agent/{it}_submission.json and rerun
# snakemake to continue
base_detect:
  method: manual

# agent/manual detection settings (all other defaults in config/base.yml)
base_agent:
  min_contrast: 20.0
  obj_threshold: 1.0e-3
  obj_min_frac: 0.1
  compact_threshold: 0.05
  # pixel sizes x 1.5 (1024 -> 1536 px)
  merge_dist: 7.5      # 5 at 1024 px
  pair_dist: 60.0      # 40 at 1024 px
  compact_box: 12      # 8 at 1024 px
  snap_radius: 4       # 3 at 1024 px
  view_px: 1024        # 768 at 1024 px: renders keep about the same zoom

# overwrite the default modelling settings
base_model:
  zoom: 1
  masks:
    margin_fac: 0.1    # was 0.2: the agent masks follow the objects closely, 10% keeps the boxes compact
    margin_min: 8      # 5 at 1024 px; small objects of up to ~32 px still fit a 48 px tile
    max_objects: 8     # was 5: lobe groups wider than a tile become objects, extra ones would be dropped
  points: true
  objects:
    gaussian:
      mean_fac: 0.2
      std_fac: 0     # fixed taper (no prior)
  tiles:
    tile_size: 48      # 32 at 1024 px (same 3.75 arcmin)
    gaussian:
      mean_fac: 0.2
      std_fac: 0     # fixed taper (no prior)

# overwrite the default plotting settings
base_plot:
  vmin: null
  vmax: null
  cbar: true
  ticks: 0
  plot_grid: false
  plot_label: false
