---

name: uno128_bce2
odir: runs/files
resume: true

---

dataset:
  train:
    name: train128_10k
    odir: ../data/runs/files
    dtype: float32
  valid:
    v_128:
      name: valid128_1k
      odir: ../data/runs/files
      dtype: float32
    v_256:
      name: valid256_1k
      odir: ../data/runs/files
      dtype: float32
    # v_512:
    #   name: valid512_1k
    #   odir: ../data/runs/files
    #   dtype: float32
    # v_1024:
    #   name: valid1024_1k
    #   odir: ../data/runs/files
    #   dtype: float32
  transform:
    log: true
    normalize: true
    standardize: false
    rotate: true
    flip: true
    batch_size: 100
  coordinates: true

dataloader:
  train:
    batch_size: 32
    shuffle: true
    num_workers: 127
    pin_memory: true
  valid:
    batch_size: 32
    num_workers: 127
    shuffle: false
    pin_memory: true

---

model:
  arch: uno
  model_args:
    in_channels: 3
    out_channels: 2
    hidden_channels: 64
    projection_channels: 64
    positional_embedding: null
    uno_out_channels: [32,64,64,64,32]
    uno_n_modes: [[16,16],[8,8],[8,8],[8,8],[16,16]]
    uno_scalings: [[1.0,1.0],[0.5,0.5],[1,1],[2,2],[1,1]]
    horizontal_skips_map: null
    channel_mlp_skip: linear
    n_layers: 5
    domain_padding: 0.2
  loss: bce
  optimizer:
    lr: 0.0005
    weight_decay: 0.0001
  scheduler:
    T_max: 100
    eta_min: 1.e-5

train:
  logger: wandb
  max_epochs: 50
  log_every_n_steps: 1

---

plot:
  odir: runs/plots
  n_copies: 5
  plot_space: True
  plot_label: True
  cmap: inferno
