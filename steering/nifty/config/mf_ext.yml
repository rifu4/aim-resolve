---

odir: /scratch/users/rfuchs/packages/aim-resolve/steering/runs/fast_vi_1f_1024_1z_b
base: base.yml
file: 4_pre_3z_2.yml
run: 2

---

mode: freq
# model frequencies at the effective frequency sum(w nu) / sum(w) of each bin (real weights and flags of
# eso_961-1503mhz.npz); the bins stay the nominal ones (lh.6 freq_bounds)  [Hz]
# (nominal bin centres: 992153320.3125, 1053594726.5625, 1114618164.0625, 1329454101.5625, 1398998058.6408134,
#  1468637695.3125)
freq: [992835436.8252982, 1053577478.5430002, 1115089356.2923512, 1331190293.0786908, 1398345163.05089,
    1465667761.324496]
ref_freq_index: 1
# the single-frequency data (eso_986-1137mhz.npz) are on half the flux scale of the multi-frequency data
# (V_SF = 0.5 V_MF on identical baselines): the transferred sky is scaled by 2 (ln 2 added to all offsets)
flux_scale: 2.0

---

opt:
  # map the KL over the samples sequentially (lax.scan) instead of vmap: ~2.5x less peak GPU memory
  # at about the same speed (synthetic test); merged into the generated opt section (odir, resume kept)
  kl_map: smap

opt.6:
  base: base_opt.6
  likelihood: =lh.6

lh.6:
  data: =data.6
  mode: fast
  split:
    size: 768
    factor: 3
  pb_correction: true  # MeerKAT primary beam in the forward model (sky model = intrinsic sky)
  # fixed bins = resolve's bins of the nominal frequencies (unchanged channel assignment)  [Hz]
  freq_bounds: [961432617.1875, 1022874023.4375, 1084106445.3125, 1222036132.8125, 1364226080.1016567,
    1433817876.9766567, 1503457513.6483433]

data.6:
  fname: /scratch/users/rfuchs/data/eso_961-1503mhz.npz
  mode: radio

base_opt.6:
  n_major_iterations: 30
  n_minor_iterations: 1
  n_samples: 4
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.e-11
      miniter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000]
      maxiter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + 2*[1000] + [2000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 1.e-4
      cg_kwargs:
        name: null
      miniter: 10*[0] + [10]
      maxiter: 10*[10] + [20]
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.e-10
      cg_kwargs:
        name: null
        miniter: 2*[5] + 2*[10] + [20]
      miniter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50] + [100]
      maxiter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + 2*[50] + [200]
      energy_reduction_factor: 1.e-3
  sample_mode: linear_resample
