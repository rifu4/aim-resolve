opt:
  odir: runs/fast_2obs_3
  key: 42
  resume: false

---

opt.0:
  likelihood: =lh.0
  n_major_iterations: 10
  n_minor_iterations: 1
  n_samples: 0
  draw_linear_kwargs:
    cg_name: SL
    cg_kwargs:
      absdelta: 1.e-11
      miniter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + [100]
      maxiter: 2*[100] + 2*[200] + 2*[350] + 2*[500] + [1000]
  nonlinearly_update_kwargs:
    minimize_kwargs:
      name: SN
      xtol: 1.e-4
      cg_kwargs:
        name: null
      miniter: 0
      maxiter: 10
  kl_kwargs:
    minimize_kwargs:
      name: M
      absdelta: 1.e-10
      cg_kwargs:
        name: null
        miniter: 2*[5] + 2*[10] + [20]
      # miniter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + [50]
      # maxiter: 2*[5] + 2*[10] + 2*[20] + 2*[35] + [50]
      miniter: 9
      maxiter: 10
      energy_reduction_factor: 1.e-3
  sample_mode: 4*[linear_resample] + [nonlinear_resample]

lh.0:
  sky: =sky.0
  data: =data.0
  data1: =data.1
  noise:
    parameters:
      mode: 1.0
      mean: 1.1
    scaling: true
  fun: fast_radio
  psf_kernel_fn: runs/kernels/pk_2obs_4f_2deg_1024a.pkl
  n_inv_kernel_fn: runs/kernels/nk_2obs_4f_2deg_1024a.pkl

data.0:
  fname: /scratch/users/rfuchs/data/eso_986-1137mhz.npz
  freq: [1, 5]
  fun: fast_radio

data.1:
  fname: /scratch/users/rfuchs/data/eso_1356-1439mhz.npz
  freq: [1, 6]
  fun: fast_radio

sky.0:
  prefix: sky.0
  background: =sky_bg.0

sky_bg.0:
  prefix: bg.0
  grid:
    base: grid_bg
  freq: [1011797851.5625, 1112110351.5625, 1367907226.5625, 1427258789.0625]
  params:
    base: params_mf
    ref_freq_index: 1
  offset: 12

grid_bg:
  space: [1024, 1024]
  fov: [2deg, 2deg]
