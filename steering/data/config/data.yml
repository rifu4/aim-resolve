---

name: test512_10
odir: files
dtype: float32

seed: 21
n_copies: 10
batch_size: 10

---

parameters:

  space:
    shape: [512, 512]
    fov: [2, 2]

  background:
    i0:
      offset_mean: 8
      offset_std: [1, 0.5]
      fluctuations: [1, 0.5]
      loglogavgslope: [-3.5, 1]
    gaussian:
      cov_x: [0.5, 0.1]
      cov_y: [0.5, 0.1]

  points:
    n_min: 0
    n_max: 25
    i0:
      mean: 15
      std: 2
    blur:
      b_min: 0
      b_max: 0.5
      steps: 100

  tiles:
    n_min: 0
    n_max: 25
    tile_size: [8, 8]
    i0:
      offset_mean: 12
      offset_std: [2, 0.5]
      fluctuations: [1, 0.5]
      loglogavgslope: [-2, 0.5]
    gaussian:
      cov_x: [0.002, 0.001]
      cov_y: [0.002, 0.001]

  objects:
    i0:
      mean: 17
      std: 2
    masks:
      m_min: 20
      m_max: 100
    zoom:
      u_min: 0.5
      u_max: 1

  func: exp

---

plot:
  odir: plots
  n_copies: 10
  space: True
  label: True
  cmap: inferno
  norm: [log, linear, linear]
  vmin: [~, 0, 0]
  vmax: [~, 1, 1]
  transpose: True
