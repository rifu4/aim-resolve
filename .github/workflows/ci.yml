name: CI

on:
  push:
    branches: ["main", "master", "claude", "aim_agent"]
  pull_request:

env:
  # the default environment needs CUDA 12.6 (feature.cuda.system-requirements); newer pixi versions check
  # this while solving every environment, also when only `cpu` is installed. GitHub runners have no GPU,
  # so tell the solver to assume CUDA (only the solve is affected, `cpu` stays the installed environment)
  CONDA_OVERRIDE_CUDA: "12.6"

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04  # GCC 13; ubuntu-latest (GCC 15) fails to compile resolve (ambiguous vmav call)

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: cpu
          pixi-version: v0.67.2  # as used locally; `latest` broke CI when pixi changed its solver checks

      - name: Lint (ruff check)
        run: pixi run -e cpu ruff check src/ tests/

      - name: Install package
        run: pixi run -e cpu pip install -e . --no-deps

      - name: Run tests
        run: pixi run -e cpu pytest tests/ -q --tb=short

  test-radio:
    runs-on: ubuntu-24.04  # GCC 13; ubuntu-latest (GCC 15) fails to compile resolve (ambiguous vmav call)
    # resolve requires cloning submodules + C++ compilation; jubik is on GitHub.
    # Mark continue-on-error so the main pipeline stays green if GitLab is down.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: cpu
          pixi-version: v0.67.2  # as used locally; `latest` broke CI when pixi changed its solver checks

      - name: Install pybind11 + setuptools (needed to build resolve)
        run: pixi run -e cpu pip install "pybind11>=2.6" setuptools

      - name: Clone resolve with submodules
        # pip install via git+ does not recurse into submodules; clone manually
        run: git clone --recursive https://gitlab.mpcdf.mpg.de/ift/resolve /tmp/resolve

      - name: Install resolve
        run: pixi run -e cpu pip install /tmp/resolve

      - name: Install jubik
        run: pixi run -e cpu pip install git+https://github.com/NIFTy-PPL/J-UBIK.git

      - name: Install package
        run: pixi run -e cpu pip install -e . --no-deps

      - name: Run tests
        run: pixi run -e cpu pytest tests/ -q --tb=short

  docs:
    runs-on: ubuntu-24.04  # GCC 13; ubuntu-latest (GCC 15) fails to compile resolve (ambiguous vmav call)
    # Only deploy on pushes to main/master; build-check on PRs too.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: cpu
          pixi-version: v0.67.2  # as used locally; `latest` broke CI when pixi changed its solver checks

      - name: Install docs dependencies
        run: pixi run -e cpu pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.25"

      - name: Install package (needed for mkdocstrings import)
        run: pixi run -e cpu pip install -e . --no-deps

      - name: Build docs
        run: pixi run -e cpu mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: pixi run -e cpu mkdocs gh-deploy --force
