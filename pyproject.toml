[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aim-resolve"
dynamic = ["version"]
description = "Automatic Identification and Modeling for Bayesian Radio Interferometric Imaging"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["radio interferometry", "bayesian inference", "image reconstruction", "jax", "nifty"]
authors = [
  {name = "Richard Fuchs", email = "richard.fuchs@tum.de"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ducc0",
    "h5py",
    "jax!=0.6",
    "jaxbind",
    "jax-finufft",
    "jax-tqdm",
    "matplotlib",
    "nifty[re]",
    "nifty8[re]",
    "pandas",
    "PyYAML",
    "scikit-learn",
]

[project.optional-dependencies]
train = [
    "lightning>=2.0",
    "neuraloperator",
    "segmentation-models-pytorch",
    "torch>=2.0",
    "wandb",
]
pipeline = [
    "snakemake",
]
radio = [
    "jubik @ git+https://github.com/NIFTy-PPL/J-UBIK.git",
    "ift-resolve @ git+https://gitlab.mpcdf.mpg.de/ift/resolve.git",
]
all = [
    "aim-resolve[train,pipeline,radio]",
]

[tool.setuptools.dynamic]
version = {attr = "aim_resolve.__version__.__version__"}

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "B028",   # no explicit stacklevel in warnings
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"tests/**" = ["B", "SIM"]
"steering/**" = ["B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["aim_resolve"]

[project.urls]
Documentation = "https://github.com/rifu4/aim-resolve#readme"
Issues = "https://github.com/rifu4/aim-resolve/issues"
Source = "https://github.com/rifu4/aim-resolve"
