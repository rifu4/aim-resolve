[workspace]
channels = ["conda-forge"]
name = "aim-resolve"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

# ── Shared (default feature) ─────────────────────────────────────────
[dependencies]
python = ">=3.11,<3.13"
pytest = ">=8.4.2,<9"
ruff = ">=0.8,<1"
pre-commit = ">=4.0,<5"
pip = ">=25.2,<26"
numpy = ">=2.3.2,<3"
scipy = ">=1.15,<2"
matplotlib = ">=3.8,<4"
pyyaml = ">=6.0,<7"
ipython = ">=8.0,<9"
jupyter = "*"
ipykernel = "*"
ducc0 = "*"
h5py = "*"
pandas = "*"
scikit-learn = "*"
wandb = "*"

[pypi-dependencies]
jaxlib = ">=0.4.30"
jaxbind = "*"
jax-finufft = "*"
jax-tqdm = "*"
torch = ">=2.0"
lightning = ">=2.0"
neuraloperator = "*"
segmentation-models-pytorch = "*"
snakemake = "*"
nifty8 = { version = ">=8.0.0,<9", extras = ["re"] }
nifty = { version = ">=9.1.0,<10", extras = ["re"] }

# ── CUDA feature (default environment) ───────────────────────────────
[feature.cuda.dependencies]
cuda-version = "12.6.*"

[feature.cuda.pypi-dependencies]
jax = { version = ">=0.4.30,!=0.6", extras = ["cuda12"] }

[feature.cuda.system-requirements]
cuda = "12.9"

# ── CPU feature ──────────────────────────────────────────────────────
[feature.cpu.pypi-dependencies]
jax = ">=0.4.30,!=0.6"

# ── Environments ─────────────────────────────────────────────────────
[environments]
default = { features = ["cuda"] }
cpu = { features = ["cpu"] }
