[workspace]
channels = ["conda-forge"]
name = "aim-resolve"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

# ── Shared (default feature) ─────────────────────────────────────────
[dependencies]
python = ">=3.11,<3.14"
pytest = ">=8.4.2,<9"
pip = ">=25.2,<26"
numpy = ">=2.3.2,<3"
scipy = ">=1.15,<2"
matplotlib = ">=3.8,<4"
pyyaml = ">=6.0,<7"
ipython = ">=8.0,<9"
jupyter = "*"
ipykernel = "*"
ducc0 = "*"
h5py = "*"
pandas = "*"
scikit-learn = "*"
ruff = ">=0.9"
pre-commit = ">=4.0"

[pypi-dependencies]
jaxbind = "*"
jax-finufft = "*"
jax-tqdm = "*"
nifty = ">=9.0.0,<10"
nifty8 = ">=8.0.0,<9"
aim-resolve = { path = ".", editable = true }

# ── train extra (mirrors [project.optional-dependencies] train) ──────
[feature.train.pypi-dependencies]
torch = ">=2.0"
lightning = ">=2.0"
neuraloperator = "*"
segmentation-models-pytorch = "*"
wandb = "*"

# ── pipeline extra (mirrors [project.optional-dependencies] pipeline) ─
[feature.pipeline.pypi-dependencies]
snakemake = "*"

# ── radio extra (mirrors [project.optional-dependencies] radio) ──────
# Installed from GitLab (not on PyPI). Requires network access to gitlab.mpcdf.mpg.de.
[feature.radio.pypi-dependencies]
jubik = { git = "https://github.com/NIFTy-PPL/J-UBIK.git" }
ift-resolve = { git = "https://gitlab.mpcdf.mpg.de/ift/resolve.git" }

# ── docs extra (mirrors [project.optional-dependencies] docs) ────────
[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.25", extras = ["python"] }

# ── CUDA feature (default environment) ───────────────────────────────
[feature.cuda.dependencies]
cuda-version = "12.6.*"

[feature.cuda.pypi-dependencies]
jax = { version = ">=0.4.30,!=0.6", extras = ["cuda12"] }

[feature.cuda.system-requirements]
cuda = "12.6"

# ── CPU feature ──────────────────────────────────────────────────────
[feature.cpu.pypi-dependencies]
jax = ">=0.4.30,!=0.6"

# ── Environments ─────────────────────────────────────────────────────
[environments]
default = { features = ["cuda", "train", "pipeline", "docs"] }
cpu = { features = ["cpu", "train", "pipeline", "docs"] }
radio-cuda = { features = ["cuda", "train", "pipeline", "radio", "docs"] }
radio-cpu = { features = ["cpu", "train", "pipeline", "radio", "docs"] }
