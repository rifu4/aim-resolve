[workspace]
channels = ["conda-forge"]
name = "aim-resolve"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

# ── Shared (default feature) ─────────────────────────────────────────
[dependencies]
python = ">=3.11,<3.14"
pytest = ">=8.4.2,<9"
pip = ">=25.2,<26"
numpy = ">=2.3.2,<3"
scipy = ">=1.15,<2"
matplotlib = ">=3.8,<4"
pyyaml = ">=6.0,<7"
ipython = ">=8.0,<9"
jupyter = "*"
ipykernel = "*"
ducc0 = "*"
h5py = "*"
pandas = "*"
scikit-learn = "*"
ruff = ">=0.9"
pre-commit = ">=4.0"

[pypi-dependencies]
jaxbind = "*"
jax-tqdm = "*"
nifty = ">=9.0.0,<10"
nifty8 = ">=8.0.0,<9"
aim-resolve = { path = ".", editable = true }

# ── train extra (mirrors [project.optional-dependencies] train) ──────
[feature.train.pypi-dependencies]
torch = ">=2.0"
lightning = ">=2.0"
neuraloperator = "*"
segmentation-models-pytorch = "*"
wandb = "*"

# ── pipeline extra (mirrors [project.optional-dependencies] pipeline) ─
[feature.pipeline.pypi-dependencies]
snakemake = "*"

# ── radio extra (mirrors [project.optional-dependencies] radio) ──────
# Installed from GitLab (not on PyPI). Requires network access to gitlab.mpcdf.mpg.de.
[feature.radio.pypi-dependencies]
jubik = { git = "https://github.com/NIFTy-PPL/J-UBIK.git" }
ift-resolve = { git = "https://gitlab.mpcdf.mpg.de/ift/resolve.git" }

# ── docs extra (mirrors [project.optional-dependencies] docs) ────────
[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.25", extras = ["python"] }

# ── CUDA feature (default environment) ───────────────────────────────
# The whole CUDA jax stack comes from conda-forge so that jaxlib (GPU) and
# jax-finufft (GPU) share one channel and a matching CUDA runtime. Mixing a pip
# jax[cuda12] with a conda jax-finufft pulled in a conda jaxlib that shadowed
# the pip CUDA jaxlib, making jax fall back to CPU. The PyPI jax-finufft wheel
# is CPU-only anyway (no CUDA lowering for the `nufft2` primitive).
[feature.cuda.dependencies]
cuda-version = "12.6.*"
jax = ">=0.4.30,!=0.6"
jaxlib = { version = ">=0.4.30,!=0.6", build = "*cuda*" }
jax-finufft = { version = "*", build = "cuda*" }

[feature.cuda.system-requirements]
cuda = "12.6"

# ── CPU feature ──────────────────────────────────────────────────────
[feature.cpu.pypi-dependencies]
jax = ">=0.4.30,!=0.6"
# CPU build of jax-finufft (the PyPI wheel ships CPU lowering rules).
jax-finufft = "*"

# ── casa feature (MeasurementSet I/O; conda-forge only) ──────────────
# python-casacore is only needed to read .ms files (e.g. convert_sgra_ms.py);
# kept out of the default/cpu environments and confined to the `casa` env.
[feature.casa.dependencies]
python-casacore = "*"

# ── Environments ─────────────────────────────────────────────────────
[environments]
default = { features = ["cuda", "train", "pipeline", "radio", "docs"] }
cpu = { features = ["cpu", "train", "pipeline", "radio", "docs"] }
# MS -> observation conversion: casacore + classic resolve (radio) + cpu jax.
casa = { features = ["casa", "radio", "cpu"] }
